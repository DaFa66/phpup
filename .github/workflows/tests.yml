name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: nix / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS matters: its /bin/bash is 3.2, the oldest shell phpup.sh must run on.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: shell version
        run: bash --version | head -1

      - name: gate
        run: bash tests/run-all.sh

  windows:
    name: windows / ${{ matrix.ps }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ps: PowerShell 7
            cmd: pwsh -NoProfile -File tests/run-all.ps1
          - ps: Windows PowerShell 5.1
            cmd: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-all.ps1
    steps:
      - uses: actions/checkout@v4

      - name: gate
        shell: cmd
        run: ${{ matrix.cmd }}

  # The control panel is shipped as a binary, so nothing above touches it: the
  # off-screen window bug reached a release with every gate green. Release
  # profile, not debug, because that is the build that goes into the zip.
  panel:
    name: panel / windows-latest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4

      - name: rust version
        run: rustc --version; cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            panel/target
          key: panel-${{ runner.os }}-${{ hashFiles('panel/Cargo.lock') }}
          restore-keys: panel-${{ runner.os }}-

      - name: unit tests
        run: cargo test --release --locked

      - name: release build
        run: cargo build --release --locked
