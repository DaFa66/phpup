[package]
name = "phpup-panel"
version = "0.1.0"
edition = "2021"
description = "Desktop control panel for phpup"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tray-icon = "0.24"

[profile.release]
opt-level = 2
