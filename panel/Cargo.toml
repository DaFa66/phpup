[package]
name = "phpup-panel"
version = "0.2.2"
edition = "2021"
description = "Desktop control panel for phpup"
homepage = "https://phpup.org"
repository = "https://github.com/DaFa66/phpup"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tray-icon = "0.24"
# Native folder picker for registering a stack. Windows uses IFileDialog through
# windows-sys; the GTK/portal backends are not needed, so no default features.
rfd = { version = "0.15", default-features = false }

# A job object is the only thing that makes a child die with the panel even when
# the panel is force-killed: closing the job handle takes its processes with it.
# Without it a closed panel left `status --watch` behind, still polling and
# writing to a pipe nobody was reading.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 2
